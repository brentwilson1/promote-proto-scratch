name: promote

on:
  workflow_dispatch:
    inputs:
      org:
        description: toy org slug
        required: true
        type: string
        default: acme
      env:
        description: target env
        required: true
        type: string
        default: prod
      sha:
        description: optional sha to tag (defaults to HEAD of default branch)
        required: false
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push_tag.outputs.tag }}
      sha: ${{ steps.push_tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag via GIT DATA API with the DEFAULT GITHUB_TOKEN
        id: push_tag
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ inputs.org }}
          ENV: ${{ inputs.env }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${IN_SHA:-$GITHUB_SHA}"
          PREFIX="${ORG}/${ENV}/v"
          LAST=$(git tag --list "${PREFIX}*" | sed "s|^${PREFIX}||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          NEXT=$(( ${LAST:-0} + 1 ))
          TAG="${PREFIX}${NEXT}"
          OBJ=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
                  -f tag="$TAG" -f message="promote ${ORG}/${ENV} -> ${TARGET_SHA}" \
                  -f object="$TARGET_SHA" -f type=commit --jq .sha)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${TAG}" -f sha="$OBJ" --jq .ref
          echo "created tag ${TAG} at ${TARGET_SHA} via API using \$GITHUB_TOKEN"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

  call-publish:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      org: ${{ inputs.org }}
      env: ${{ inputs.env }}
      sha: ${{ needs.tag.outputs.sha }}
