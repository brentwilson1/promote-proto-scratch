name: publish

on:
  push:
    tags:
      - '*/prod/v*'
  workflow_call:
    inputs:
      org:
        required: true
        type: string
      env:
        required: true
        type: string
      sha:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Echo context and inputs
        run: |
          echo "=== how did we get here ==="
          echo "event_name = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "ref_type   = ${{ github.ref_type }}"
          echo "sha        = ${{ github.sha }}"
          echo "actor      = ${{ github.actor }}"
          echo "run_id     = ${{ github.run_id }}"
          echo "=== workflow_call inputs (empty on push) ==="
          echo "inputs.org = '${{ inputs.org }}'"
          echo "inputs.env = '${{ inputs.env }}'"
          echo "inputs.sha = '${{ inputs.sha }}'"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move pointer tag with the DEFAULT GITHUB_TOKEN
        if: ${{ inputs.org != '' }}
        env:
          ORG: ${{ inputs.org }}
          ENV: ${{ inputs.env }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          POINTER="${ORG}/${ENV}/current"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$POINTER" -m "points at ${SHA}" "$SHA"
          git push -f origin "refs/tags/${POINTER}"
          echo "moved pointer ${POINTER} -> ${SHA}"
